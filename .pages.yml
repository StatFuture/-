media:
- name: images
  label: 图片
  input: media/images
  output: media/images
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  rename: safe
- name: files
  label: 资料附件
  input: media/files
  output: media/files
  extensions:
  - pdf
  - doc
  - docx
  - ppt
  - pptx
  - xls
  - xlsx
  - zip
  rename: safe
- name: videos
  label: 短视频
  input: media/videos
  output: media/videos
  extensions:
  - mp4
  - webm
  rename: safe
content:
- name: profile
  label: 个人资料与网站设置
  type: file
  path: data/profile.json
  format: json
  fields:
  - name: profile
    label: 个人资料
    type: object
    list: true
    fields:
    - name: label
      label: 字段名称
      type: string
    - name: value
      label: 字段内容
      type: text
  - name: programs
    label: 指导研究生专业
    type: object
    list: true
    fields:
    - name: label
      label: 学位类型
      type: string
    - name: value
      label: 专业名称
      type: string
  - name: overview
    label: 个人概况
    type: text
  - name: directions
    label: 研究方向
    type: string
    list: true
  - name: team
    label: 团队介绍
    type: text
  - name: portrait
    label: 教师照片
    type: image
    options:
      media: images
  - name: admissions
    label: 招生链接
    type: object
    list: true
    fields:
    - name: label
      label: 链接标题
      type: string
    - name: url
      label: 网址
      type: string
  - name: pageSize
    label: 第一版每页容量上限
    type: select
    options:
      values:
      - name: '10'
        label: 10条
      - name: '20'
        label: 20条
      - name: '50'
        label: 50条
    description: 页面结合屏幕大小与论文长度自动计算容量，并将记录均衡分配；这是上限，不是固定条数。
- name: news
  label: 新闻资料（备用）
  type: collection
  path: content/news
  format: json
  filename:
    template: '{year}{month}{day}{hour}{minute}{second}-{primary}.json'
    field: create
  subfolders: false
  view:
    fields:
    - title
    - published
    - order
    primary: title
    sort:
    - order
    - title
    default:
      sort: order
      order: asc
  fields:
  - name: title
    label: 新闻标题
    type: string
    required: true
  - name: date
    label: 日期
    type: date
    options:
      format: yyyy-MM-dd
  - name: summary
    label: 摘要
    type: text
  - name: body
    label: 正文
    type: text
    description: 支持多段文字；配图、视频和附件在下方单独添加。
  - name: pinned
    label: 置顶
    type: boolean
  - &id004
    name: images
    label: 配图
    type: image
    list: true
    options:
      media: images
  - &id005
    name: attachment
    label: 资料附件
    type: file
    options:
      media: files
  - &id006
    name: video
    label: 上传短视频
    type: file
    options:
      media: videos
    description: 试验约定单个不超过20 MB；长视频请填写播放链接。
  - &id007
    name: videoUrl
    label: 视频播放链接
    type: string
    description: 可填写 https 视频文件或视频平台页面网址。
  - &id008
    name: poster
    label: 视频封面
    type: image
    options:
      media: images
  - &id001
    name: published
    label: 在网站显示
    type: boolean
    description: 第一版不增加新栏目。新闻与独立资料仅保存备用；资料只有选择原版已有栏目时才在那里显示。
  - &id002
    name: order
    label: 排列序号
    type: number
    description: 数字越小越靠前；同序号的新闻按日期从新到旧排列。
    options:
      min: 0
  exclude:
  - .gitkeep
- name: members
  label: 团队成员
  type: collection
  path: content/members
