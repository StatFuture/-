- name: v2_settings
  label: 第二版｜首页与展示设置
  type: file
  path: versions/v2/data/settings.json
  format: json
  fields:
  - name: school
    label: 学校
    type: string
  - name: college
    label: 学院
    type: string
  - name: teamName
    label: 团队名称
    type: string
  - name: labIntro
    label: 实验室简介
    type: text
  - name: teacherHomepage
    label: 教师主页网址
    type: string
  - name: admissionNote
    label: 招生补充说明（经核实后填写）
    type: text
  - name: pageSize
    label: 每页条数
    type: select
    options:
      values:
      - name: '10'
        label: 10条
      - name: '20'
        label: 20条
      - name: '50'
        label: 50条
  - name: slides
    label: 首页横图
    type: object
    list:
      collapsible: true
    fields:
    - name: id
      label: 图片标识
      type: string
    - name: image
      label: 横图
      type: image
      options:
        media: images
    - name: caption
      label: 说明
      type: string
    - name: order
      label: 排列序号
      type: number
    - name: published
      label: 显示
      type: boolean
    - name: imageFit
      label: 照片显示方式
      type: select
      options:
        values:
        - name: contain
          label: 完整显示（适合团队合照）
        - name: cover
          label: 铺满横幅（可能裁切）
    - name: focusX
      label: 横向显示位置（0左，50中，100右）
      type: number
      default: 50
      options:
        min: 0
        max: 100
    - name: focusY
      label: 纵向显示位置（0上，50中，100下）
      type: number
      default: 50
      options:
        min: 0
        max: 100
  - name: researchAreas
    label: 团队研究方向（不填写则显示已收录成员资料）
    type: object
    list: true
    fields:
    - name: title
      label: 方向名称
      type: string
    - name: description
      label: 研究介绍
      type: text
  - name: admissionsIntro
    label: 团队招生与培养说明
    type: text
  - name: admissionContacts
    label: 招生联系导师
    type: object
    list: true
    fields:
    - name: name
      label: 姓名
      type: string
    - name: description
      label: 方向与培养说明
      type: text
    - name: email
      label: 邮箱
      type: string
  - name: autoPlay
    label: 首页图片自动轮换
    type: boolean
    default: true
  - name: slideIntervalSeconds
    label: 每张图片停留时间（秒）
    type: number
    default: 3
    options:
      min: 3
      max: 15
  - name: previewPlaceholders
    label: 显示待补充的教师与新闻样本位置
    type: boolean
    description: 仅用于查看排版；不是实际成员或新闻。有真实新闻后自动显示真实内容。
    default: false
